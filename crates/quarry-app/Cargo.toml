[package]
name = "quarry-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "quarry"
path = "src/main.rs"

# `cargo packager --release -f <format>` from the workspace root; output lands in dist/
[package.metadata.packager]
product-name = "Quarry"
identifier = "dev.thekodeking.quarry"
category = "DeveloperTool"
out-dir = "../../dist"
binaries = [{ path = "quarry", main = true }]
# Each format picks the file it needs
icons = [
  "../../assets/icon/quarry.icns",
  "../../assets/icon/quarry.ico",
  "../../assets/icon/quarry-16.png",
  "../../assets/icon/quarry-32.png",
  "../../assets/icon/quarry-128.png",
  "../../assets/icon/quarry-256.png",
  "../../assets/icon/quarry-512.png",
]

[package.metadata.packager.nsis]
installer-icon = "../../assets/icon/quarry.ico"

[dependencies]
quarry-core = { workspace = true }
quarry-sql = { workspace = true }
gpui = { workspace = true }
tokio = { workspace = true }
crossbeam-channel = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
keyring = { workspace = true }
lsp-types = { workspace = true }
sqlformat = { workspace = true }
trash = { workspace = true }
cargo-packager-updater = "0.2.3"

# Window blur: our own NSVisualEffectView behind gpui's content (src/blur.rs). Already in the
# tree via gpui; only the AppKit bits we use are enabled.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSView", "NSVisualEffectView", "NSGraphics", "NSWindow"] }
raw-window-handle = "0.6"

[build-dependencies]
winresource = "0.1"

[lints]
workspace = true
